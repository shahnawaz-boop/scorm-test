<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCORM 1.2 Wrapper</title>
<!--
  SCORM 1.2 wrapper. Host this file at the ROOT of the unzipped course
  (same folder as imsmanifest.xml), so it is on the same origin as the course.

  URL parameters
    po        Origin of the Salesforce page that frames this wrapper
              (e.g. https://myorg.lightning.force.com). Required when framed.
    launch    Optional. Course launch path. Default: first <resource href> in
              imsmanifest.xml, else scormdriver/indexAPI.html
    autosave  Optional. Seconds between automatic saves. Default 30.
    debug     Optional. 1 = show an on-screen log.

  Standalone test (not framed): progress is kept in localStorage.
    https://YOUR-SITE.netlify.app/wrapper.html?debug=1

  Messages WRAPPER -> HOST   { source:'scorm-wrapper', type, payload }
    READY    sent repeatedly until the host answers with INIT
    COMMIT   progress snapshot (LMSCommit, autosave, tab hidden)
    FINISH   final snapshot (LMSFinish)
    UNLOAD   best-effort snapshot when the page is closing
    SAVED    reply to REQUEST_SAVE
    ERROR    { message }

  Messages HOST -> WRAPPER   { source:'scorm-host', type, payload }
    INIT          payload: { studentId, studentName, lessonStatus, lessonLocation,
                  scoreRaw, scoreMin, scoreMax, suspendData, totalTime, entry,
                  mode, credit, launchData, masteryScore, maxTimeAllowed,
                  timeLimitAction, commentsFromLms }   (all optional)
    REQUEST_SAVE  asks for an immediate snapshot (reply: SAVED)

  Snapshot fields: lessonStatus, lessonLocation, scoreRaw, scoreMin, scoreMax,
  suspendData, exit, sessionTime, totalTime, comments, objectives[],
  interactions[], reason, savedAt
-->
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
  #course { border: 0; width: 100%; height: 100%; display: block; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #555; font-size: 14px; padding: 24px; text-align: center; }
  #dbg { display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 35%; overflow: auto;
         background: #111; color: #9f9; font: 11px/1.4 monospace; padding: 6px; margin: 0;
         z-index: 9; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="msg">Loading course&hellip;</div>
<iframe id="course" title="Course content" allow="fullscreen; autoplay; encrypted-media" allowfullscreen hidden></iframe>
<pre id="dbg"></pre>

<script>
(function () {
  'use strict';

  /* ---------- configuration ---------- */
  var params = new URLSearchParams(location.search);
  var DEBUG = params.get('debug') === '1';
  var AUTOSAVE_MS = Math.max(5, parseInt(params.get('autosave'), 10) || 30) * 1000;
  var MANIFEST = 'imsmanifest.xml';
  var FRAMED = window.parent !== window;
  var PARENT_ORIGIN = '';
  try { if (params.get('po')) { PARENT_ORIGIN = new URL(params.get('po')).origin; } } catch (e) { /* invalid */ }
  var STANDALONE = !FRAMED;

  var $msg = document.getElementById('msg');
  var $frame = document.getElementById('course');
  var $dbg = document.getElementById('dbg');

  function log() {
    if (!DEBUG) { return; }
    var line = Array.prototype.slice.call(arguments).map(function (a) {
      return typeof a === 'string' ? a : JSON.stringify(a);
    }).join(' ');
    $dbg.style.display = 'block';
    $dbg.textContent += line + '\n';
    $dbg.scrollTop = $dbg.scrollHeight;
  }

  function fatal(text) {
    $msg.textContent = text;
    $msg.style.display = 'flex';
    $frame.hidden = true;
    log('FATAL', text);
    if (!STANDALONE && PARENT_ORIGIN) { post('ERROR', { message: text }); }
  }

  /* ---------- helpers ---------- */
  function pad(n, w) { var s = String(n); while (s.length < w) { s = '0' + s; } return s; }
  var TIMESPAN = /^\d{2,4}:[0-5]\d:[0-5]\d(\.\d{1,2})?$/;
  function toCs(t) {
    var m = /^(\d+):(\d{2}):(\d{2})(?:\.(\d{1,2}))?$/.exec(t || '');
    if (!m) { return 0; }
    var f = m[4] ? parseInt((m[4] + '0').slice(0, 2), 10) : 0;
    return ((+m[1]) * 3600 + (+m[2]) * 60 + (+m[3])) * 100 + f;
  }
  function fromCs(cs) {
    cs = Math.max(0, Math.round(cs));
    var h = Math.floor(cs / 360000); cs -= h * 360000;
    var m = Math.floor(cs / 6000);   cs -= m * 6000;
    var s = Math.floor(cs / 100);    cs -= s * 100;
    return pad(h, 4) + ':' + pad(m, 2) + ':' + pad(s, 2) + '.' + pad(cs, 2);
  }
  function str(v) { return (v === undefined || v === null) ? '' : String(v); }

  /* ---------- CMI data model ---------- */
  var data = {};
  var extra = {};            // indexed elements: objectives / interactions
  var objCount = 0, intCount = 0;
  var initialized = false, finished = false, dirty = false, started = false;
  var lastError = 0, startedAt = 0, initTotalCs = 0;

  function resetData() {
    data = {
      'cmi.core.student_id': '', 'cmi.core.student_name': '', 'cmi.core.lesson_location': '',
      'cmi.core.credit': 'credit', 'cmi.core.lesson_status': 'not attempted',
      'cmi.core.entry': 'ab-initio', 'cmi.core.score.raw': '', 'cmi.core.score.min': '',
      'cmi.core.score.max': '', 'cmi.core.total_time': '0000:00:00.00',
      'cmi.core.lesson_mode': 'normal', 'cmi.core.exit': '', 'cmi.core.session_time': '',
      'cmi.suspend_data': '', 'cmi.launch_data': '', 'cmi.comments': '', 'cmi.comments_from_lms': '',
      'cmi.student_data.mastery_score': '', 'cmi.student_data.max_time_allowed': '',
      'cmi.student_data.time_limit_action': '',
      'cmi.student_preference.audio': '', 'cmi.student_preference.language': '',
      'cmi.student_preference.speed': '', 'cmi.student_preference.text': ''
    };
    extra = {}; objCount = 0; intCount = 0;
  }
  resetData();

  var READ_ONLY = {
    'cmi.core.student_id': 1, 'cmi.core.student_name': 1, 'cmi.core.credit': 1, 'cmi.core.entry': 1,
    'cmi.core.total_time': 1, 'cmi.core.lesson_mode': 1, 'cmi.launch_data': 1, 'cmi.comments_from_lms': 1,
    'cmi.student_data.mastery_score': 1, 'cmi.student_data.max_time_allowed': 1,
    'cmi.student_data.time_limit_action': 1
  };
  var STATUS = ['passed', 'completed', 'failed', 'incomplete', 'browsed', 'not attempted'];
  var EXITS = ['time-out', 'suspend', 'logout', ''];
  function isScore(v) { return v === '' || (/^-?\d+(\.\d+)?$/.test(v) && +v >= 0 && +v <= 100); }
  var VALIDATE = {
    'cmi.core.lesson_status': function (v) { return STATUS.indexOf(v) > -1; },
    'cmi.core.exit': function (v) { return EXITS.indexOf(v) > -1; },
    'cmi.core.score.raw': isScore, 'cmi.core.score.min': isScore, 'cmi.core.score.max': isScore,
    'cmi.core.session_time': function (v) { return TIMESPAN.test(v); },
    'cmi.core.lesson_location': function (v) { return v.length <= 255; },
    'cmi.suspend_data': function (v) { return v.length <= 131072; },
    'cmi.comments': function (v) { return v.length <= 131072; }
  };
  var OBJ_RE = /^cmi\.objectives\.(\d+)\.(id|status|score\.(?:raw|min|max))$/;
  var INT_RE = /^cmi\.interactions\.(\d+)\.(id|time|type|weighting|student_response|result|latency|objectives\.\d+\.id|correct_responses\.\d+\.pattern)$/;

  var ERR = {
    0: 'No error', 101: 'General exception', 201: 'Invalid argument error',
    202: 'Element cannot have children', 203: 'Element not an array - cannot have count',
    301: 'Not initialized', 401: 'Not implemented error',
    402: 'Invalid set value, element is a keyword', 403: 'Element is read only',
    404: 'Element is write only', 405: 'Incorrect data type'
  };
  function ok(v) { lastError = 0; return v; }
  function fail(code, v) { lastError = code; return v; }

  /* ---------- snapshot ---------- */
  function sessionCs() {
    var st = data['cmi.core.session_time'];
    if (st) { return toCs(st); }
    return startedAt ? Math.round((Date.now() - startedAt) / 10) : 0;
  }
  function collect(kind) {
    var re = new RegExp('^cmi\\.' + kind + '\\.(\\d+)\\.(.+)$');
    var out = [];
    Object.keys(extra).forEach(function (k) {
      var m = re.exec(k);
      if (!m) { return; }
      var i = +m[1];
      out[i] = out[i] || { index: i };
      out[i][m[2]] = extra[k];
    });
    return out.filter(function (x) { return x; });
  }
  function snapshot(reason) {
    var sess = sessionCs();
    return {
      reason: reason,
      lessonStatus: data['cmi.core.lesson_status'],
      lessonLocation: data['cmi.core.lesson_location'],
      scoreRaw: data['cmi.core.score.raw'],
      scoreMin: data['cmi.core.score.min'],
      scoreMax: data['cmi.core.score.max'],
      suspendData: data['cmi.suspend_data'],
      exit: data['cmi.core.exit'],
      sessionTime: fromCs(sess),
      totalTime: fromCs(initTotalCs + sess),
      comments: data['cmi.comments'],
      objectives: collect('objectives'),
      interactions: collect('interactions'),
      savedAt: new Date().toISOString()
    };
  }

  /* ---------- messaging / persistence ---------- */
  var LOCAL_KEY = 'scormWrapper:' + location.pathname;
  function saveLocal(snap) {
    try {
      var copy = {};
      Object.keys(snap).forEach(function (k) { copy[k] = snap[k]; });
      copy.entry = snap.exit === 'suspend' ? 'resume' : '';
      localStorage.setItem(LOCAL_KEY, JSON.stringify(copy));
    } catch (e) { /* storage unavailable */ }
  }
  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch (e) { return {}; }
  }
  function post(type, payload) {
    log('>>', type, payload || '');
    if (STANDALONE) {
      if (payload && (type === 'COMMIT' || type === 'FINISH' || type === 'UNLOAD' || type === 'SAVED')) {
        saveLocal(payload);
      }
      return;
    }
    if (!PARENT_ORIGIN) { return; }
    window.parent.postMessage({ source: 'scorm-wrapper', type: type, payload: payload || null }, PARENT_ORIGIN);
  }

  /* ---------- SCORM 1.2 API ---------- */
  function lmsInitialize(p) {
    if (p !== '') { return fail(201, 'false'); }
    if (!initialized) { initialized = true; finished = false; startedAt = Date.now(); }
    log('LMSInitialize');
    return ok('true');
  }

  function lmsFinish(p) {
    if (!initialized) { return fail(301, 'false'); }
    if (p !== '') { return fail(201, 'false'); }
    var sess = sessionCs();
    data['cmi.core.session_time'] = fromCs(sess);
    if (data['cmi.core.lesson_status'] === 'not attempted') { data['cmi.core.lesson_status'] = 'incomplete'; }
    var snap = snapshot('finish');
    initTotalCs += sess;
    data['cmi.core.total_time'] = fromCs(initTotalCs);
    initialized = false; finished = true; dirty = false;
    log('LMSFinish');
    post('FINISH', snap);
    return ok('true');
  }

  function lmsCommit(p) {
    if (!initialized) { return fail(301, 'false'); }
    if (p !== '') { return fail(201, 'false'); }
    post('COMMIT', snapshot('commit'));
    dirty = false;
    return ok('true');
  }

  function lmsGetValue(k) {
    if (!initialized) { return fail(301, ''); }
    if (typeof k !== 'string' || !k) { return fail(201, ''); }
    switch (k) {
      case 'cmi._version': return ok('3.4');
      case 'cmi.core._children':
        return ok('student_id,student_name,lesson_location,credit,lesson_status,entry,score,total_time,lesson_mode,exit,session_time');
      case 'cmi.core.score._children': return ok('raw,min,max');
      case 'cmi.student_data._children': return ok('mastery_score,max_time_allowed,time_limit_action');
      case 'cmi.student_preference._children': return ok('audio,language,speed,text');
      case 'cmi.objectives._children': return ok('id,score,status');
      case 'cmi.objectives._count': return ok(String(objCount));
      case 'cmi.interactions._children':
        return ok('id,objectives,time,type,correct_responses,weighting,student_response,result,latency');
      case 'cmi.interactions._count': return ok(String(intCount));
      case 'cmi.core.exit':
      case 'cmi.core.session_time': return fail(404, '');
    }
    if (/\._children$/.test(k)) { return fail(202, ''); }
    if (/\._count$/.test(k)) { return fail(203, ''); }
    if (OBJ_RE.test(k)) { return Object.prototype.hasOwnProperty.call(extra, k) ? ok(extra[k]) : fail(201, ''); }
    if (INT_RE.test(k)) { return fail(404, ''); }
    if (Object.prototype.hasOwnProperty.call(data, k)) { return ok(data[k]); }
    return fail(401, '');
  }

  function lmsSetValue(k, v) {
    if (!initialized) { return fail(301, 'false'); }
    if (typeof k !== 'string' || !k) { return fail(201, 'false'); }
    v = str(v);
    if (/\._children$/.test(k) || /\._count$/.test(k) || k === 'cmi._version') { return fail(402, 'false'); }
    if (READ_ONLY[k]) { return fail(403, 'false'); }
    var m;
    if ((m = OBJ_RE.exec(k))) {
      extra[k] = v; objCount = Math.max(objCount, +m[1] + 1); dirty = true;
      return ok('true');
    }
    if ((m = INT_RE.exec(k))) {
      extra[k] = v; intCount = Math.max(intCount, +m[1] + 1); dirty = true;
      return ok('true');
    }
    if (!Object.prototype.hasOwnProperty.call(data, k)) { return fail(401, 'false'); }
    if (VALIDATE[k] && !VALIDATE[k](v)) { return fail(405, 'false'); }
    data[k] = v; dirty = true;
    log('SetValue', k, v.length > 80 ? v.slice(0, 80) + '...(' + v.length + ')' : v);
    return ok('true');
  }

  window.API = {
    LMSInitialize: lmsInitialize,
    LMSFinish: lmsFinish,
    LMSGetValue: lmsGetValue,
    LMSSetValue: lmsSetValue,
    LMSCommit: lmsCommit,
    LMSGetLastError: function () { return String(lastError); },
    LMSGetErrorString: function (c) { return ERR[c] || ''; },
    LMSGetDiagnostic: function (c) { return ERR[c || lastError] || ''; }
  };

  /* ---------- start-up ---------- */
  function applyInit(d) {
    resetData();
    d = d || {};
    data['cmi.core.student_id'] = str(d.studentId);
    data['cmi.core.student_name'] = str(d.studentName);
    data['cmi.core.lesson_status'] = d.lessonStatus || 'not attempted';
    data['cmi.core.lesson_location'] = str(d.lessonLocation);
    data['cmi.core.score.raw'] = str(d.scoreRaw);
    data['cmi.core.score.min'] = str(d.scoreMin);
    data['cmi.core.score.max'] = str(d.scoreMax);
    data['cmi.suspend_data'] = str(d.suspendData);
    data['cmi.launch_data'] = str(d.launchData);
    data['cmi.comments_from_lms'] = str(d.commentsFromLms);
    data['cmi.student_data.mastery_score'] = str(d.masteryScore);
    data['cmi.student_data.max_time_allowed'] = str(d.maxTimeAllowed);
    data['cmi.student_data.time_limit_action'] = str(d.timeLimitAction);
    data['cmi.core.lesson_mode'] = d.mode || 'normal';
    data['cmi.core.credit'] = d.credit || (d.mode === 'browse' ? 'no-credit' : 'credit');
    data['cmi.core.total_time'] = TIMESPAN.test(str(d.totalTime)) ? d.totalTime : '0000:00:00.00';
    initTotalCs = toCs(data['cmi.core.total_time']);
    data['cmi.core.entry'] = d.entry || (d.suspendData ? 'resume' : 'ab-initio');
  }

  // Rise/Storyline read cmi.launch_data (adlcp:datafromlms in the manifest).
  function readManifest() {
    if (typeof fetch !== 'function') { return Promise.resolve({}); }
    return fetch(MANIFEST, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) {
        if (!t) { return {}; }
        var x = new DOMParser().parseFromString(t, 'application/xml');
        var dl = x.getElementsByTagNameNS('*', 'datafromlms')[0];
        var res = x.getElementsByTagNameNS('*', 'resource')[0];
        return { launchData: dl ? dl.textContent.trim() : '', href: res ? res.getAttribute('href') : '' };
      })
      .catch(function () { return {}; });
  }

  function safeLaunchUrl(p) {
    if (!p || /^\//.test(p) || /\.\./.test(p) || /[\\:]/.test(p) || !/^[A-Za-z0-9_\-.\/%~?&=]+$/.test(p)) { return null; }
    try {
      var u = new URL(p, location.href);
      return u.origin === location.origin ? u.href : null;
    } catch (e) { return null; }
  }

  function startCourse() {
    if (started) { return; }
    started = true;
    readManifest().then(function (m) {
      if (!data['cmi.launch_data'] && m.launchData) { data['cmi.launch_data'] = m.launchData; }
      var launch = params.get('launch') || m.href || 'scormdriver/indexAPI.html';
      var url = safeLaunchUrl(launch);
      if (!url) { fatal('Invalid launch path.'); return; }
      log('Launching', url);
      $frame.src = url;
      $frame.hidden = false;
      $msg.style.display = 'none';
    });
  }

  /* host -> wrapper */
  window.addEventListener('message', function (e) {
    if (STANDALONE) { return; }
    if (e.origin !== PARENT_ORIGIN || e.source !== window.parent) { return; }
    var m = e.data;
    if (!m || m.source !== 'scorm-host') { return; }
    log('<<', m.type);
    if (m.type === 'INIT' && !started) {
      clearInterval(readyTimer);
      applyInit(m.payload);
      startCourse();
    } else if (m.type === 'REQUEST_SAVE') {
      post('SAVED', snapshot('host-request'));
      dirty = false;
    }
  });

  /* autosave + exit handling */
  setInterval(function () {
    if (initialized && dirty) { post('COMMIT', snapshot('autosave')); dirty = false; }
  }, AUTOSAVE_MS);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && initialized && dirty) {
      post('COMMIT', snapshot('hidden')); dirty = false;
    }
  });
  window.addEventListener('pagehide', function () {
    if (initialized) { post('UNLOAD', snapshot('unload')); }
  });

  /* boot */
  var readyTimer = null;
  if (FRAMED && !PARENT_ORIGIN) {
    fatal('Missing or invalid "po" parameter (Salesforce origin).');
  } else if (STANDALONE) {
    log('Standalone mode (progress kept in localStorage)');
    applyInit(loadLocal());
    startCourse();
  } else {
    var tries = 0;
    readyTimer = setInterval(function () {
      tries += 1;
      if (started) { clearInterval(readyTimer); return; }
      if (tries > 40) { clearInterval(readyTimer); fatal('Could not reach the host page.'); return; }
      post('READY', { tries: tries });
    }, 500);
    post('READY', { tries: 0 });
  }
})();
</script>
</body>
</html>
